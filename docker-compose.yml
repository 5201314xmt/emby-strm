# ============================================================
# 缺集管家 v2.0 - Docker Compose 配置文件
#
# 使用步骤（3 步）：
#   1. 复制 .env.example 为 .env，修改 MEDIA_DIR 为你的 STRM 目录宿主机路径
#   2. 执行：docker compose up -d --build
#   3. 浏览器打开 http://你的IP:8899
#
# 容器内路径：
#   STRM 文件挂载到 /media（只读）
#   数据文件存 /app/data
#
# 升级：docker compose up -d --build
# 停止：docker compose down
# 备份：把 ./data 目录复制走即可
# ============================================================

services:
  queji:
    build: .
    container_name: queji
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8899}:8899"

    volumes:
      # STRM 文件目录（只读挂载到容器内 /media）
      - "${MEDIA_DIR:?请在.env中设置MEDIA_DIR}:/media:ro"

      # 第二个 STRM 目录（可选）
      # 取消下面注释并在 .env 中配 MEDIA_DIR2
      # - "${MEDIA_DIR2:-/第二个strm目录}:/media2:ro"

      # 数据目录（数据库、备份等）
      - "${DATA_DIR:-./data}:/app/data"

    # 从 .env 文件读取环境变量
    env_file:
      - .env

    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data

    # 健康检查（CMD-SHELL 格式保证引号正确）
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8899/api/health', timeout=3)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
