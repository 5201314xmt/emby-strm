# ============================================================
# Alembic 数据库迁移配置
#
# 用来管理数据库表的版本化变更（建表、改表、加字段等）。
# 小白不需要手动操作——首次启动应用会自动建表。
#
# 命令速查：
#   生成迁移脚本：alembic revision --autogenerate -m "描述"
#   应用迁移：     alembic upgrade head
#   回滚：         alembic downgrade -1
# ============================================================

[alembic]
# 迁移脚本存放目录
script_location = alembic

# 数据库连接 URL（留空，由 env.py 从 config.py 读取）
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
