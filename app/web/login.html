<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>缺集管家 - 登录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="logo" style="text-align:center">缺集管家</div>
    <h2 id="modeTitle" style="text-align:center;margin:14px 0 18px">登录</h2>

    <div class="form-line">
      <label>密码</label>
      <input type="password" id="pwd" placeholder="请输入密码" autofocus>
    </div>

    <div class="form-line" id="confirmRow" style="display:none">
      <label>确认密码</label>
      <input type="password" id="pwd2" placeholder="再输入一遍密码">
    </div>

    <div id="errMsg" class="login-err"></div>

    <button id="btnSubmit" class="btn big">登录</button>
    <div class="muted" id="hint" style="margin-top:14px;text-align:center;font-size:13px"></div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
